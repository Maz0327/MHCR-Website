<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1208;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0e0a06;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080608;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.8" />
      <stop offset="60%" style="stop-color:#000000;stop-opacity:0.3" />
    </linearGradient>
    <!-- Kitchen grid lines suggest a room -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Dark background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Kitchen counter suggestion (right side) -->
  <rect x="880" y="400" width="960" height="300" rx="4" fill="rgba(139,90,43,0.15)" stroke="rgba(139,90,43,0.2)" stroke-width="1"/>
  <rect x="880" y="680" width="960" height="60" rx="2" fill="rgba(80,60,40,0.25)" stroke="rgba(100,70,40,0.2)" stroke-width="1"/>
  <!-- Upper cabinets suggestion -->
  <rect x="880" y="200" width="960" height="170" rx="4" fill="rgba(100,80,55,0.12)" stroke="rgba(120,90,60,0.18)" stroke-width="1"/>
  <!-- Cabinet lines -->
  <line x1="1160" y1="200" x2="1160" y2="370" stroke="rgba(120,90,60,0.15)" stroke-width="1"/>
  <line x1="1440" y1="200" x2="1440" y2="370" stroke="rgba(120,90,60,0.15)" stroke-width="1"/>
  <line x1="1700" y1="200" x2="1700" y2="370" stroke="rgba(120,90,60,0.15)" stroke-width="1"/>
  <!-- Counter division lines -->
  <line x1="1160" y1="400" x2="1160" y2="680" stroke="rgba(100,80,55,0.12)" stroke-width="1"/>
  <line x1="1440" y1="400" x2="1440" y2="680" stroke="rgba(100,80,55,0.12)" stroke-width="1"/>
  <!-- Subtle pendant light -->
  <line x1="1360" y1="0" x2="1360" y2="340" stroke="rgba(232,90,27,0.3)" stroke-width="2"/>
  <circle cx="1360" cy="350" r="30" fill="rgba(232,90,27,0.08)" stroke="rgba(232,90,27,0.25)" stroke-width="1"/>
  <circle cx="1360" cy="350" r="18" fill="rgba(232,90,27,0.15)"/>
  <!-- Window light -->
  <rect x="1500" y="220" width="200" height="130" rx="2" fill="rgba(255,220,150,0.06)" stroke="rgba(255,220,150,0.12)" stroke-width="1"/>

  <!-- Gradient overlay (left side darkens for text) -->
  <rect width="1920" height="1080" fill="url(#overlay)"/>

  <!-- Placeholder label -->
  <rect x="0" y="0" width="1920" height="1080" fill="rgba(0,0,0,0)" />
  <rect x="60" y="30" width="520" height="60" rx="8" fill="rgba(232,90,27,0.9)"/>
  <text x="80" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="2">� PLACEHOLDER  REPLACE WITH ACTUAL PHOTO</text>
  <text x="80" y="72" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">File: hero-bg.jpg/webp  |  Size: 1920�1080px  |  Subject: Premium completed kitchen or main project photo</text>
</svg>