<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1208;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e0a06;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="500" fill="url(#bg)" rx="12"/>
  <!-- Before/After split suggestion -->
  <line x1="300" y1="60" x2="300" y2="440" stroke="rgba(232,90,27,0.6)" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Left side "BEFORE" -->
  <rect x="30" y="80" width="240" height="340" rx="8" fill="rgba(40,30,20,0.6)" stroke="rgba(80,60,40,0.3)" stroke-width="1"/>
  <text x="150" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="3">BEFORE</text>
  <!-- Old cabinet lines -->
  <rect x="50" y="160" width="200" height="90" rx="3" fill="rgba(80,70,60,0.3)" stroke="rgba(100,80,60,0.2)" stroke-width="1"/>
  <line x1="150" y1="160" x2="150" y2="250" stroke="rgba(100,80,60,0.2)" stroke-width="1"/>
  <rect x="50" y="270" width="200" height="110" rx="3" fill="rgba(70,60,50,0.25)" stroke="rgba(100,80,60,0.15)" stroke-width="1"/>

  <!-- Right side "AFTER" -->
  <rect x="330" y="80" width="240" height="340" rx="8" fill="rgba(26,26,26,0.8)" stroke="rgba(232,90,27,0.15)" stroke-width="1"/>
  <text x="450" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="rgba(232,90,27,0.8)" text-anchor="middle" letter-spacing="3">AFTER</text>
  <!-- New cabinet lines -->
  <rect x="350" y="160" width="200" height="90" rx="6" fill="rgba(232,90,27,0.08)" stroke="rgba(232,90,27,0.25)" stroke-width="1"/>
  <line x1="450" y1="160" x2="450" y2="250" stroke="rgba(232,90,27,0.15)" stroke-width="1"/>
  <rect x="350" y="270" width="200" height="110" rx="6" fill="rgba(30,25,20,0.6)" stroke="rgba(232,90,27,0.12)" stroke-width="1"/>

  <!-- "BEFORE / AFTER" label in center -->
  <rect x="260" y="230" width="80" height="40" rx="20" fill="rgba(232,90,27,0.9)"/>
  <text x="300" y="254" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">BEFORE/AFTER</text>

  <!-- Bottom label -->
  <rect x="0" y="452" width="600" height="48" rx="0 0 12px 12px" fill="rgba(232,90,27,0.85)"/>
  <text x="300" y="471" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1.5">� PLACEHOLDER  REPLACE WITH ACTUAL BEFORE/AFTER PHOTO</text>
  <text x="300" y="487" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.9)" text-anchor="middle">File: why-us-photo.jpg  |  Size: 600�500px  |  Subject: Dramatic before/after project comparison</text>
</svg>